ID: FAST-UI
_schema-version: '2.1'
version: 0.4.1
modules:
  - name: FAST-app
    type: html5
    path: app
    requires:
      - name: srv_api
        group: destinations
        properties:
          forwardAuthToken: true
          name: srv_api
          url: '~{url}'
      - name: uaa_FAST-UI
resources:
  - name: uaa_FAST-UI
    parameters:
      path: ./xs-security.json
      service-plan: default
      service: xsuaa
    type: org.cloudfoundry.managed-service
  - name: srv_api
    type: configuration
    parameters:
      provider-id: FAST:srv_api
      provider-nid: mta
      target:
        org: ${org}
        space: ${space}
      version: '>=0.0.0'
