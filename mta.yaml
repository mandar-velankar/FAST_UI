ID: FASTUI
_schema-version: '2.1'
version: 0.4.1

build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm install

modules:
  - name: FASTUI-app
    type: html5
    path: app
    build-parameters:
      builder: custom
      commands:
      - npm install
      - npm run build
    parameters:
      memory: 1024M
      disk-quota: 4096M
    requires:
      - name: FAST-logging
      - name: srv_api
        group: destinations
        properties:
          forwardAuthToken: true
          name: srv_api
          url: '~{url}'
          timeout: 120000
      - name: uaa_FAST
resources:
  - name: FAST-logging
    type: org.cloudfoundry.managed-service
    parameters:
       service: application-logs
       service-plan: lite
  - name: uaa_FAST
    parameters:
      path: ./xs-security.json
      service-plan: application
      service: xsuaa
    type: org.cloudfoundry.existing-service
  - name: srv_api
    type: configuration
    parameters:
      provider-id: FAST:srv_api
      provider-nid: mta
      target:
        org: ${org}
        space: ${space}
      version: '>=0.0.0'