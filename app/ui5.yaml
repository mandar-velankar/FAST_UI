    - bundleDefinition:
        name: "com/bayer/tender/uilib/src/com/bayer/tender/uilib/library-preload.js"
        defaultFileTypes:
        - ".js"
        - ".json"
        - ".xml"
        - ".html"
        - ".library"
        sections:
          - mode: preload
            filters:
              - com/bayer/tender/uilib/src/com/bayer/tender/uilib/library.js
              - com/bayer/tender/uilib/src/com/bayer/tender/uilib/manifest.json
              - com/bayer/tender/uilib/src/com/bayer/tender/uilib/messagebyndle.properties
              - com/bayer/tender/uilib/src/com/bayer/tender/uilib/controllers/**
              - com/bayer/tender/uilib/src/com/bayer/tender/uilib/controls/**
              - com/bayer/tender/uilib/src/com/bayer/tender/uilib/libs/**
              - com/bayer/tender/uilib/src/com/bayer/tender/uilib/objects/**
              - com/bayer/tender/uilib/src/com/bayer/tender/uilib/themes/**
            resolve: false
            sort: true
      bundleOptions:
        optimize: true
        usePredefineCalls: true