specVersion: '2.2'
metadata:
  name: com.bayer.app
type: application
server:
  customMiddleware:
  - name: ui5-middleware-simpleproxy
    afterMiddleware: compression
    mountPath: /v2
    configuration:
      baseUri: "http://localhost:4004/v2"
      removeETag: true
builder:
  resources:
    excludes:
      - "/templates/**"
  customTasks:
  - name: ui5-task-transpile
    afterTask: replaceVersion
    configuration:
      debug: false
      removeConsoleStatements: true
      transpileAsync: true
      excludePatterns:
      - "lib"
      - "libs"
      - "themes"
  bundles:
    - bundleDefinition:
        name: "com/bayer/tender/Component-preload.js"
        defaultFileTypes:
        - ".js"
        - ".json"
        - ".xml"
        - ".html"
        - ".library"
        sections:
          - mode: preload
            filters:
              - com/bayer/tender/Component.js
              - com/bayer/tender/manifest.json
              - "!com/bayer/tender/contractsapp/**"
              - "!com/bayer/tender/epa/**"
              - "!com/bayer/tender/landingspage/**"
              - "!com/bayer/tender/templates/**"
              - "!com/bayer/tender/tender/**"
              - "!com/bayer/tender/ppa/**"
              - "!com/bayer/tender/uilib/**"
            resolve: false
            sort: true
      bundleOptions:
        optimize: true
        usePredefineCalls: true
    - bundleDefinition:
        name: "com/bayer/tender/contracts/webapp/Component-preload.js"
        defaultFileTypes:
        - ".js"
        - ".json"
        - ".xml"
        - ".html"
        - ".library"
        sections:
          - mode: preload
            filters:
              - com/bayer/tender/contracts/webapp/Component.js
              - com/bayer/tender/contracts/webapp/manifest.json
              - com/bayer/tender/contracts/webapp/controller/**
              - com/bayer/tender/contracts/webapp/i18n/**
              - com/bayer/tender/contracts/webapp/model/**
              - com/bayer/tender/contracts/webapp/service/**
              - com/bayer/tender/contracts/webapp/state/**
              - com/bayer/tender/contracts/webapp/view/**
            resolve: false
            sort: true
      bundleOptions:
        optimize: true
        usePredefineCalls: true
    - bundleDefinition:
        name: "com/bayer/tender/epa/webapp/Component-preload.js"
        defaultFileTypes:
        - ".js"
        - ".json"
        - ".xml"
        - ".html"
        - ".library"
        sections:
          - mode: preload
            filters:
              - com/bayer/tender/epa/webapp/Component.js
              - com/bayer/tender/epa/webapp/manifest.json
              - com/bayer/tender/epa/webapp/controller/**
              - com/bayer/tender/epa/webapp/i18n/**
              - com/bayer/tender/epa/webapp/model/**
              - com/bayer/tender/epa/webapp/service/**
              - com/bayer/tender/epa/webapp/state/**
              - com/bayer/tender/epa/webapp/view/**
            resolve: false
            sort: true
      bundleOptions:
        optimize: true
        usePredefineCalls: true
    - bundleDefinition:
        name: "com/bayer/tender/landingspage/webapp/Component-preload.js"
        defaultFileTypes:
        - ".js"
        - ".json"
        - ".xml"
        - ".html"
        - ".library"
        sections:
          - mode: preload
            filters:
              - com/bayer/tender/landingspage/webapp/Component.js
              - com/bayer/tender/landingspage/webapp/manifest.json
              - com/bayer/tender/landingspage/webapp/controller/**
              - com/bayer/tender/landingspage/webapp/i18n/**
              - com/bayer/tender/landingspage/webapp/model/**
              - com/bayer/tender/landingspage/webapp/service/**
              - com/bayer/tender/landingspage/webapp/state/**
              - com/bayer/tender/landingspage/webapp/view/**
            resolve: false
            sort: true
      bundleOptions:
        optimize: true
        usePredefineCalls: true
    - bundleDefinition:
        name: "com/bayer/tender/tender/webapp/Component-preload.js"
        defaultFileTypes:
        - ".js"
        - ".json"
        - ".xml"
        - ".html"
        - ".library"
        sections:
          - mode: preload
            filters:
              - com/bayer/tender/tender/webapp/Component.js
              - com/bayer/tender/tender/webapp/manifest.json
              - com/bayer/tender/tender/webapp/controller/**
              - com/bayer/tender/tender/webapp/i18n/**
              - com/bayer/tender/tender/webapp/model/**
              - com/bayer/tender/tender/webapp/service/**
              - com/bayer/tender/tender/webapp/state/**
              - com/bayer/tender/tender/webapp/view/**
            resolve: false
            sort: true
      bundleOptions:
        optimize: true
        usePredefineCalls: true
    - bundleDefinition:
        name: "com/bayer/tender/ppa/webapp/Component-preload.js"
        defaultFileTypes:
