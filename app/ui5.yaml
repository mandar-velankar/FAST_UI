          - mode: preload
            filters:
              - com/bayer/tender/ppa/webapp/Component.js
              - com/bayer/tender/ppa/webapp/manifest.json
              - com/bayer/tender/ppa/webapp/controller/**
              - com/bayer/tender/ppa/webapp/i18n/**
              - com/bayer/tender/ppa/webapp/model/**
              - com/bayer/tender/ppa/webapp/service/**
