specVersion: '2.3'
metadata:
  name: com.bayer.app
type: application
server:
  customMiddleware:
  - name: ui5-middleware-simpleproxy
    afterMiddleware: compression
    mountPath: /v2
    configuration:
      baseUri: "http://localhost:4004/v2"
      removeETag: true
  - name: ui5-middleware-simpleproxy
    afterMiddleware: compression
    mountPath: /admin
    configuration:
      baseUri: "http://localhost:8083/"
      removeETag: true
  - name: ui5-middleware-simpleproxy
    afterMiddleware: compression
    mountPath: /createsalesopportunity
    configuration:
      baseUri: "http://localhost:8084/"
      removeETag: true
  - name: ui5-middleware-simpleproxy
    afterMiddleware: compression
    mountPath: /bankguarantees
    configuration:
      baseUri: "http://localhost:8085/"
      removeETag: true
  - name: ui5-middleware-simpleproxy
    afterMiddleware: compression
    mountPath: /priceagreements
    configuration:
      baseUri: "http://localhost:8086/"
      removeETag: true
  - name: ui5-middleware-simpleproxy
    afterMiddleware: compression
    mountPath: /brazilcontracting
    configuration:
      baseUri: "http://localhost:8088/"
      removeETag: true
  - name: ui5-middleware-simpleproxy
    afterMiddleware: compression
    mountPath: /claims
    configuration:
      baseUri: "http://localhost:8089/"
      removeETag: true
  # - name: ui5-middleware-simpleproxy
  #   afterMiddleware: compression
  #   mountPath: /standardtender
  #   configuration:
  #     baseUri: "http://localhost:8089/"
  #     removeETag: true
  - name: fiori-tools-servestatic
    afterMiddleware: compression
    configuration:
      paths:
        - path: /standardtender
          src: ../../F_TNDR_CAG_FAST_STANDARD_TENDERS/webapp
  - name: fiori-tools-servestatic
    afterMiddleware: compression
    configuration:
      paths:
        - path: /whc
          src: ../../F_TNDR_CAG_FAST_WHC/app/whcapp/webapp
  - name: ui5-middleware-simpleproxy
    afterMiddleware: compression
    mountPath: /app
    configuration:
      baseUri: "http://localhost:8080/landingspage/webapp/"
      removeETag: true
builder:
  cachebuster:
    signatureType: time
  resources:
    excludes:
      - "/templates/**"
  customTasks:
  - name: ui5-task-cachebuster-indexing
    afterTask: generateVersionInfo
  bundles:
    - bundleDefinition:
        name: "com/bayer/tender/landingspage/Component-preload.js"
        defaultFileTypes:
        - ".js"
        - ".json"
        - ".xml"
        - ".html"
        - ".library"
        sections:
          - mode: preload
            filters:
              - com/bayer/tender/landingspage/Component.js
              - com/bayer/tender/landingspage/manifest.json
              - com/bayer/tender/landingspage/i18n/**
              - com/bayer/tender/landingspage/model/**
              - com/bayer/tender/landingspage/controller/**
              - com/bayer/tender/landingspage/service/**
              - com/bayer/tender/landingspage/state/**
              - com/bayer/tender/landingspage/view/**
              - "!com/bayer/tender/landingspage/contractsapp/**"
              - "!com/bayer/tender/landingspage/salesopportunity/**"
              - "!com/bayer/tender/landingspage/epa/**"
              - "!com/bayer/tender/landingspage/landingspage/**"
              - "!com/bayer/tender/landingspage/templates/**"
              - "!com/bayer/tender/landingspage/tender/**"
              - "!com/bayer/tender/landingspage/ppa/**"
              - "!com/bayer/tender/landingspage/uilib/**"
            resolve: false
            sort: true
      bundleOptions:
        optimize: true
        usePredefineCalls: true
    - bundleDefinition:
        name: "com/bayer/tender/landingspage/contracts/webapp/Component-preload.js"
        defaultFileTypes:
        - ".js"
        - ".json"
        - ".xml"
        - ".html"
        - ".library"
        sections:
          - mode: preload
            filters:
              - com/bayer/tender/landingspage/contracts/webapp/Component.js
              - com/bayer/tender/landingspage/contracts/webapp/manifest.json
              - com/bayer/tender/landingspage/contracts/webapp/controller/**
              - com/bayer/tender/landingspage/contracts/webapp/i18n/**
              - com/bayer/tender/landingspage/contracts/webapp/model/**
              - com/bayer/tender/landingspage/contracts/webapp/service/**
              - com/bayer/tender/landingspage/contracts/webapp/state/**
              - com/bayer/tender/landingspage/contracts/webapp/view/**
            resolve: false
            sort: true
      bundleOptions:
        optimize: true
        usePredefineCalls: true
    - bundleDefinition:
        name: "com/bayer/tender/landingspage/salesopportunity/webapp/Component-preload.js"
        defaultFileTypes:
