<!DOCTYPE html>
<html>
<head>
	
	<link href="./images/Company-Logo-White.svg" rel="shortcut icon" type="image/x-icon" />
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>FAST Tender Framework</title>
	<script>
		(function() {
			var proxied = window.XMLHttpRequest.prototype.open;
			 var cacheTimestamp = '%CACHE-TIMESTAMP%';
			window.XMLHttpRequest.prototype.open = function() {
				var url = arguments[1];
				if(url.indexOf("?") == -1){ url = url + "?"; }
				arguments[1] = url + "&cache-timestamp=" + cacheTimestamp;//data._TheAppVersion;
				return proxied.apply(this, [].slice.call(arguments));
			};
		})();
	</script>
	<script id="sap-ui-bootstrap"
			src="https://sapui5.hana.ondemand.com/1.72.11/resources/sap-ui-core.js"
			data-sap-ui-theme="sap_belize"
			data-sap-ui-resourceroots='{
				"com.bayer.tender.landingspage": "./"
			}'
			data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
			data-sap-ui-compatVersion="edge"
			data-sap-ui-async="true"
			data-sap-ui-frameOptions="trusted">
	</script>

</head>
<body class="sapUiBody">
	<div data-sap-ui-component data-name="com.bayer.tender.landingspage" data-id="container" data-height="100%" style="height: 100%" data-settings='{"id" : "landingspage"}'></div>
</body>
</html>
