#XSEL: Option to sort the master list by Contract
masterSort1=Sort By <Contract>

#XSEL: Option to sort the master list by stock
masterSort2=Sort By <stock>

#XSEL: Option to filter the master list by stock
masterFilterName=<stock>

#XSEL: Option to not filter the master list
masterFilterNone=none


#XSEL: Option to filter the master list by  if the value is less than 100
masterFilter1=<100 

#XSEL: Option to filter the master list by  if the value is greater than 100
masterFilter2=>100 

#YMSG: Filter text that is displayed above the master list
masterFilterBarText=Filtered by {0}

#XSEL: Option to not group the master list
masterGroupNone=(Not grouped)

#XSEL: Option to group the master list by stock
masterGroup1=<stock> Group

#XGRP: Group header stock
masterGroup1Header1=<stock> 20 or less

#XGRP: Group header stock
masterGroup1Header2=<stock> higher than 20

