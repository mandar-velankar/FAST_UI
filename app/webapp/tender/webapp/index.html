<!DOCTYPE html>
<html>
<head>
	
	<link href="./images/Company-Logo-White.svg" rel="shortcut icon" type="image/x-icon" />
	
	<meta charset="utf-8">
	
	<title>FAST Tender Framework</title>
	
	<script
		id="sap-ui-bootstrap"
		src="https://sapui5.hana.ondemand.com/1.84.0/resources/sap-ui-core.js"
		data-sap-ui-theme="sap_belize"
		data-sap-ui-libs="sap.m, sap.ushell, sap.collaboration"
		data-sap-ui-compatVersion="edge"
		data-sap-ui-async="true"
		data-sap-ui-xx-supportedLanguages=""
		data-sap-ui-resourceroots='{
			"FAST_NS0FAST0": "./"}'>
	</script>
	
	<!-- data-sap-ui-theme-roots='{"FAST_NS0FAST0" : "./themes/UI5/"}' will be used in the future -->
	<!-- data-sap-ui-xx-supportedLanguages="en" will be added to indicate the languages that we support, this avoids 404 errors on browser languages that don't have a i18n translation -->
	
	<script>
		sap.ui.getCore().attachInit(function() {
			new sap.ui.core.ComponentContainer({
					height : "100%",
					name : "FAST_NS0FAST0",
					settings: {
						id: "FastComponent"
					}
				}).placeAt("content");
		});
	</script>
	
</head>

<!--timer is started class="sapUiBody" id="content" onload="StartTimers();" onmousemove="ResetTimers();" -->
<body class="sapUiBody" id="content" >
</body>

</html>
